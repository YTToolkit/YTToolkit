<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Title Generator – YTToolkit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Free YouTube Title Generator to create catchy, SEO-friendly titles for your videos.">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 700px;
      margin: 60px auto;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      color: #cbd5f5;
      margin-bottom: 30px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
    }

    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #2563eb;
    }

    .results {
      margin-top: 30px;
      text-align: left;
    }

    .title {
      background: #1e293b;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .title:hover {
      background: #334155;
    }

    a {
      color: #60a5fa;
      text-decoration: none;
      display: inline-block;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>YouTube Title Generator</h1>
    <p>Enter your video topic and choose a style to generate viral YouTube titles.</p>

    <input type="text" id="topic" placeholder="Enter your video topic">

  <select id="tone">
  <option value="howto">How-to</option>
  <option value="list">List</option>
  <option value="curiosity">Curiosity</option>
  <option value="beginner">Beginner Friendly</option>
  <option value="emotional">Emotional</option>
  <option value="viral">Viral / Clickbait</option>
  <option value="shorts">YouTube Shorts</option>
  <option value="educational">Educational</option>
  <option value="comparison">Comparison</option>
</select>

    <button onclick="generateTitles()">Generate Titles</button>

    <div class="results" id="results"></div>

    <a href="index.html">← Back to Home</a>
  </div>

  <script>
  function generateTitles() {
    let topic = document.getElementById("topic").value.toLowerCase().trim();

// clean common phrases
topic = topic
  .replace(/\?/g, "")
  .replace(/^how to\s+/i, "")
  .replace(/\btutorial\b/i, "")
  .replace(/\bguide\b/i, "")
  .replace(/\btips\b/i, "")
  .replace(/\s+/g, " ")
  .trim();

// capitalize first letter
topic = topic.charAt(0).toUpperCase() + topic.slice(1);
    const tone = document.getElementById("tone").value;
    const results = document.getElementById("results");

    results.innerHTML = "";

    if (!topic) {
      results.innerHTML = "<p>Please enter a topic.</p>";
      return;
    }

    let titles = [];

    switch (tone) {
   case "howto":
  titles = [
    `How to ${topic} (Step-by-Step Tutorial)`,
    `How to ${topic} Easily for Beginners`,
    `${topic}: Step-by-Step Guide`,
    `How to ${topic} the Right Way`,
    `Learn How to ${topic} in Minutes`
  ];
  break;

      case "list":
        titles = [
          `5 Ways to ${topic}`,
          `7 Mistakes When You ${topic}`,
          `10 Tips to ${topic}`,
          `Top Secrets to ${topic}`,
          `Best Tricks to ${topic}`
        ];
        break;

      case "curiosity":
        titles = [
          `Nobody Tells You This About ${topic}`,
          `The Truth About ${topic}`,
          `Why ${topic} Isn’t What You Think`,
          `I Tried ${topic} – Here’s What Happened`,
          `This Changed How I See ${topic}`
        ];
        break;

      case "beginner":
        titles = [
          `${topic} Explained for Beginners`,
          `Beginner’s Guide to ${topic}`,
          `${topic} Made Simple`,
          `Start ${topic} Today`,
          `${topic} Basics You Must Know`
        ];
        break;

      case "emotional":
        titles = [
          `This ${topic} Changed My Life`,
          `Why ${topic} Was So Hard for Me`,
          `My Honest Experience With ${topic}`,
          `I Almost Quit ${topic}`,
          `The Emotional Side of ${topic}`
        ];
        break;

      case "viral":
        titles = [
          `You Won’t Believe This ${topic} Trick`,
          `${topic} Is Going Viral`,
          `Everyone Is Talking About ${topic}`,
          `This ${topic} Hack Blew Up`,
          `Stop Scrolling If You Want to ${topic}`
        ];
        break;

      case "shorts":
        titles = [
          `${topic} in 30 Seconds`,
          `Quick ${topic} Tip`,
          `${topic} Explained FAST`,
          `${topic} Shorts That Went Viral`,
          `${topic} in One Minute`
        ];
        break;

      case "educational":
        titles = [
          `${topic} Explained Clearly`,
          `Learn ${topic} Step by Step`,
          `${topic} Full Explanation`,
          `${topic} Simplified`,
          `Understanding ${topic}`
        ];
        break;

      case "comparison":
        titles = [
          `${topic} vs Reality`,
          `${topic} – Which Is Better?`,
          `${topic} Compared Honestly`,
          `Is ${topic} Worth It?`,
          `${topic} Pros and Cons`
        ];
        break;
    }

    titles.forEach(title => {
      const div = document.createElement("div");
      div.className = "title";
      div.textContent = title;
      div.onclick = () => {
        navigator.clipboard.writeText(title);
        alert("Title copied!");
      };
      results.appendChild(div);
    });
  }
</script>

</body>
</html>
