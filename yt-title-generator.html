<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Title Generator – YTToolkit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Free YouTube Title Generator to create catchy, SEO-friendly titles for your videos.">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 700px;
      margin: 60px auto;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      color: #cbd5f5;
      margin-bottom: 30px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
    }

    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #2563eb;
    }

    .results {
      margin-top: 30px;
      text-align: left;
    }

    .title {
      background: #1e293b;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .title:hover {
      background: #334155;
    }

    a {
      color: #60a5fa;
      text-decoration: none;
      display: inline-block;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>YouTube Title Generator</h1>
    <p>Enter your video topic and choose a style to generate viral YouTube titles.</p>

    <input type="text" id="topic" placeholder="Enter your video topic">

    <select id="tone">
  <option value="How to">How-to</option>
  <option value="List">List</option>
  <option value="Curiosity">Curiosity</option>
  <option value="Beginner">Beginner Friendly</option>
  <option value="Emotional">Emotional</option>
  <option value="Viral">Viral / Clickbait</option>
  <option value="Shorts">YouTube Shorts</option>
  <option value="Educational">Educational</option>
  <option value="Comparison">Comparison</option>
</select>

    <button onclick="generateTitles()">Generate Titles</button>

    <div class="results" id="results"></div>

    <a href="index.html">← Back to Home</a>
  </div>

  <script>
   if (tone === "Emotional") {
  titles = [
    `This ${topic} Changed My Life`,
    `I Was Struggling Until I Learned ${topic}`,
    `The Emotional Truth About ${topic}`,
    `Why ${topic} Is Harder Than You Think`,
    `My Honest Experience With ${topic}`
  ];
}

if (tone === "Viral / Clickbait") {
  titles = [
    `You Won’t Believe This ${topic} Trick`,
    `${topic} Is Breaking the Internet`,
    `Everyone Is Talking About ${topic}`,
    `This ${topic} Hack Went Viral`,
    `Stop Scrolling If You Want to ${topic}`
  ];
}

if (tone === "Shorts") {
  titles = [
    `${topic} in 30 Seconds`,
    `${topic} Explained FAST`,
    `Quick ${topic} Tip`,
    `${topic} Shorts You Must Watch`,
    `${topic} in One Minute`
  ];
}

if (tone === "Educational") {
  titles = [
    `${topic} Explained Clearly`,
    `Understanding ${topic} Step by Step`,
    `Learn ${topic} the Smart Way`,
    `${topic} Full Explanation`,
    `${topic} Simplified`
  ];
}

if (tone === "Comparison") {
  titles = [
    `${topic} vs Reality`,
    `${topic}: What’s Better?`,
    `${topic} Compared (Honest Review)`,
    `Is ${topic} Worth It?`,
    `${topic} Pros and Cons`
  ];
}
  </script>

</body>
</html>
