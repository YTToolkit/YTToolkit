<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Title Generator – YTToolkit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Free YouTube Title Generator to create catchy, SEO-friendly titles for your videos.">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 700px;
      margin: 60px auto;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      color: #cbd5f5;
      margin-bottom: 30px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
    }

    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #2563eb;
    }

    .results {
      margin-top: 30px;
      text-align: left;
    }

    .title {
      background: #1e293b;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .title:hover {
      background: #334155;
    }

    a {
      color: #60a5fa;
      text-decoration: none;
      display: inline-block;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>YouTube Title Generator</h1>
    <p>Enter your video topic and choose a style to generate viral YouTube titles.</p>

    <input type="text" id="topic" placeholder="Enter your video topic">

  <select id="tone">
  <option value="howto">How-to</option>
  <option value="list">List</option>
  <option value="curiosity">Curiosity</option>
  <option value="beginner">Beginner Friendly</option>
  <option value="emotional">Emotional</option>
  <option value="viral">Viral / Clickbait</option>
  <option value="shorts">YouTube Shorts</option>
  <option value="educational">Educational</option>
  <option value="comparison">Comparison</option>
</select>

    <button onclick="generateTitles()">Generate Titles</button>

    <div class="results" id="results"></div>

    <a href="index.html">← Back to Home</a>
  </div>

  <script>
 const TITLE_PATTERNS = {
  howto: [
    topic => `How to ${topic} (Step-by-Step Tutorial)`,
    topic => `How to ${topic} the Right Way`,
    topic => `Learn How to ${topic} from Scratch`,
    topic => `How to ${topic} Without Getting Confused`,
    topic => `How to ${topic}: Beginner-Friendly Guide`
  ],

  authority: [
    topic => `${topic}: The Complete Beginner’s Guide`,
    topic => `${topic} Explained by a Pro`,
    topic => `${topic} Made Simple`,
    topic => `Everything You Need to Know About ${topic}`
  ],

  curiosity: [
    topic => `Most People Learn ${topic} the Wrong Way`,
    topic => `Why ${topic} Is Harder Than It Looks`,
    topic => `This Is the Easiest Way to ${topic}`,
    topic => `The Truth About ${topic}`
  ],

  speed: [
    topic => `${topic} in 10 Minutes`,
    topic => `Learn ${topic} Faster Than You Think`,
    topic => `${topic} in Under 15 Minutes`
  ],

  mistakes: [
    topic => `Big Mistakes Beginners Make When Learning ${topic}`,
    topic => `Stop Doing This When You Learn ${topic}`,
    topic => `Why You’re Struggling With ${topic}`
  ]
};
  function generateTitles() {
    let topic = document.getElementById("topic").value.toLowerCase().trim();

// clean common phrases
topic = topic
  .replace(/\?/g, "")
  .replace(/^how to\s+/i, "")
  .replace(/\btutorial\b/i, "")
  .replace(/\bguide\b/i, "")
  .replace(/\btips\b/i, "")
  .replace(/\s+/g, " ")
  .trim();

// capitalize first letter
topic = topic.charAt(0).toUpperCase() + topic.slice(1);
    const tone = document.getElementById("tone").value;
    const results = document.getElementById("results");

    results.innerHTML = "";

    if (!topic) {
      results.innerHTML = "<p>Please enter a topic.</p>";
      return;
    }

   // pick patterns based on selected tone
const selectedPatterns = patterns[tone];

if (!selectedPatterns) {
  results.innerHTML = "<p>No patterns found.</p>";
  return;
}

// shuffle patterns
const shuffled = selectedPatterns.sort(() => 0.5 - Math.random());

// generate titles
let titles = shuffled.slice(0, 5).map(fn => fn(topic));

// shuffle so results feel human
patterns = patterns.sort(() => 0.5 - Math.random());

// take 5 titles
let titles = patterns.slice(0, 5).map(fn => fn(topic));

    titles.forEach(title => {
      const div = document.createElement("div");
      div.className = "title";
      div.textContent = title;
      div.onclick = () => {
        navigator.clipboard.writeText(title);
        alert("Title copied!");
      };
      results.appendChild(div);
    });
  }
</script>

</body>
</html>
